<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klasse! A2.2 Kapitel 8 – Wortschatzcheck</title><style>body{font-family:system-ui,sans-serif;background:#f2f5fa;color:#17263a;margin:0}main{max-width:720px;margin:25px auto;padding:16px}.card{background:white;padding:20px;border-radius:14px;margin:0 0 15px;box-shadow:0 2px 10px #14233b12}label{display:block;padding:12px;margin:8px 0;border:1px solid #d4dce7;border-radius:9px}label:has(input:checked){background:#e4eeff;border-color:#3265bd}input[type=text]{padding:12px;font-size:16px;max-width:90%;border:1px solid #9aa;border-radius:8px}button{background:#2456b5;color:white;border:0;padding:13px 20px;border-radius:9px;font-size:16px}button:disabled{background:#aaa}#result{display:none}.wrong{color:#a32626}.right{color:#126335}</style></head><body><main><section class="card"><h1>Klasse! A2.2 · Kapitel 8</h1><h2>Ich hätte gern …</h2><p>Wortschatzcheck · 12 Fragen · ca. 5 Minuten</p><p>Wähle jeweils eine richtige Antwort.</p><p><input type="text" id="name" placeholder="Vorname und Nachname" required></p></section><form id="quiz"></form><section class="card" id="result"></section></main><script>const qs=[["Kuidas öelda saksa keeles „kleit“?",["das Kleid","der Rock","die Hose"],0],["Was bedeutet „die Jacke“?",["jakk","särk","seelik"],0],["Kuidas öelda „kingad“?",["die Schuhe","die Socken","die Handschuhe"],0],["Was bedeutet „anprobieren“?",["proovima (selga)","ostma","vahetama"],0],["Kuidas öelda „odav“?",["teuer","billig","eng"],1],["Was ist das Gegenteil von „lang“?",["kurz","weit","dunkel"],0],["Was bedeutet „die Größe“ beim Einkaufen?",["suurus","hind","värv"],0],["Welche Bitte ist höflich?",["Gib mir das!","Könnten Sie mir bitte helfen?","Du musst helfen!"],1],["Ergänze: Ich ___ gern diese Hose anprobieren.",["würde","habe","bin"],0],["Ergänze: ___ Sie mir bitte eine andere Größe zeigen?",["Könnten","Müssen","Sind"],0],["Was bedeutet „passen“? (Die Schuhe passen mir.)",["sobima","maksma","otsima"],0],["Was sagt man, wenn man etwas kaufen möchte?",["Ich hätte gern dieses T-Shirt.","Ich bin gestern gekommen.","Ich muss nach Hause gehen."],0]];const form=document.getElementById('quiz');qs.forEach((q,i)=>{let s=document.createElement('section');s.className='card';let h=document.createElement('h3');h.textContent=(i+1)+'. '+q[0];s.append(h);q[1].forEach((v,j)=>{let l=document.createElement('label');let r=document.createElement('input');r.type='radio';r.name='q'+i;r.value=j;r.required=true;l.append(r,document.createTextNode(' '+v));s.append(l)});form.append(s)});let b=document.createElement('button');b.textContent='Test abgeben';form.append(b);form.addEventListener('submit',e=>{e.preventDefault();let name=document.getElementById('name').value.trim();if(!name){alert('Bitte Namen eingeben.');return}let data=new FormData(form),score=0,lines=[];qs.forEach((q,i)=>{let a=Number(data.get('q'+i)),ok=a===q[2];if(ok)score++;lines.push((i+1)+'. '+(ok?'✓':'✗')+' '+q[0]+' | Antwort: '+q[1][a]+' | Richtig: '+q[1][q[2]])});let res=document.getElementById('result');res.style.display='block';res.innerHTML='<h2>Ergebnis</h2><h1>'+score+'/12 ('+Math.round(score/12*100)+'%)</h1><p id="person"></p><p>Zeige deinem Lehrer das Ergebnis oder kopiere die Zusammenfassung.</p><button type="button" id="copy">Ergebnis kopieren</button><h3>Antworten</h3><div id="answers"></div>';document.getElementById('person').textContent=name;lines.forEach((v,i)=>{let p=document.createElement('p');p.className=Number(data.get('q'+i))===qs[i][2]?'right':'wrong';p.textContent=v;document.getElementById('answers').append(p)});document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(name+' – Klasse A2 Kapitel 8 – '+score+'/12\n'+lines.join('\n')).then(()=>alert('Kopiert!')).catch(()=>alert('Bitte Screenshot machen.'));form.querySelectorAll('input,button').forEach(x=>x.disabled=true);res.scrollIntoView({behavior:'smooth'})});</script></body></html>
