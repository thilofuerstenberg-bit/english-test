<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Unit 3 Test · Grade 9</title><style>body{font-family:system-ui,sans-serif;background:#f3f6fb;color:#17253b;margin:0}main{max-width:780px;margin:25px auto;padding:18px}header,.card{background:white;padding:22px;border-radius:16px;margin-bottom:16px;box-shadow:0 2px 12px #14233b12}h1{margin:0 0 8px}label{display:block;margin:12px 0;padding:12px;border:1px solid #dce2ea;border-radius:9px;cursor:pointer}label:has(input:checked){background:#e6efff;border-color:#3766cc}input[type=text]{padding:12px;border:1px solid #9daabd;border-radius:8px;width:min(95%,400px);font-size:16px}button{border:0;border-radius:9px;background:#2457b9;color:white;padding:15px 23px;font-size:17px;cursor:pointer}button:disabled{background:#999}.muted{color:#596579}.correct{color:#126333}.wrong{color:#a32c30}#result{display:none}small{color:#5d6678}</style></head><body><main><header><h1>Grade 9 · English Unit 3</h1><p>Crime vocabulary & passive voice · 20 questions · 20 points</p><p class="muted">Choose one answer per question. Your answers are scored automatically on this device.</p><label for="student">Student name <input id="student" type="text" placeholder="First and last name" autocomplete="name" required></label></header><form id="quiz"></form><section id="result" class="card" aria-live="polite"></section></main><script>
const questions=[["v","A person who steals from a shop is a ...",["shoplifter","burglar","witness"],0],["v","Someone who sees a crime happen is a ...",["suspect","witness","victim"],1],["v","The police ... a suspect when they take them into custody.",["arrest","rob","escape"],0],["v","A person who illegally enters a house to steal is a ...",["pickpocket","burglar","detective"],1],["v","The person harmed by a crime is the ...",["criminal","judge","victim"],2],["v","To take something using force or threats is to ...",["rob","investigate","prove"],0],["v","A clue or information that helps prove what happened is ...",["evidence","punishment","sentence"],0],["v","A person believed to have committed a crime is a ...",["witness","suspect","lawyer"],1],["v","The police are trying to ... the robbery.",["investigate","sentence","steal"],0],["v","The punishment given by a court is called a ...",["sentence","suspect","clue"],0],["p","Choose the correct passive: The police arrested the thief yesterday.",["The thief is arrested yesterday.","The thief was arrested yesterday.","The thief has arrested yesterday."],1],["p","Choose the correct passive: Someone has stolen my bike.",["My bike has been stolen.","My bike was been stolen.","My bike has stolen."],0],["p","Choose the correct passive: They will question the suspect tomorrow.",["The suspect will questioned tomorrow.","The suspect will be questioned tomorrow.","The suspect is being question tomorrow."],1],["p","Choose the correct passive: They are investigating the crime.",["The crime is being investigated.","The crime has being investigated.","The crime was investigate."],0],["p","Choose the correct passive: People must obey the law.",["The law must obey.","The law must be obeyed.","The law is must obeyed."],1],["p","Choose the correct passive: The judge sentenced the criminal.",["The criminal was sentenced by the judge.","The criminal is sentence by the judge.","The criminal had sentence the judge."],0],["p","Choose the correct passive: Someone had broken the window.",["The window had broken.","The window had been broken.","The window has been break."],1],["p","Choose the correct passive: The police don't allow visitors here.",["Visitors aren't allowed here.","Visitors don't allowed here.","Visitors weren't allow here."],0],["p","Choose the correct active meaning of: The wallet was found by a tourist.",["A tourist found the wallet.","A tourist was finding the wallet.","The wallet found a tourist."],0],["p","Choose the correct passive question: Did they catch the thief?",["Was the thief caught?","Did the thief was caught?","Is the thief catch?"],0]];
const form=document.getElementById('quiz');
questions.forEach((q,i)=>{const s=document.createElement('section');s.className='card';s.innerHTML='<small>'+(q[0]==='v'?'Vocabulary':'Passive voice')+' · Question '+(i+1)+'</small><h3></h3>';s.querySelector('h3').textContent=q[1];q[2].forEach((answer,j)=>{const l=document.createElement('label');const inp=document.createElement('input');inp.type='radio';inp.name='q'+i;inp.value=j;inp.required=true;l.append(inp,document.createTextNode(' '+answer));s.append(l)});form.append(s)});
const b=document.createElement('button');b.type='submit';b.textContent='Finish & see score';form.append(b);
form.addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('student').value.trim();if(!name){alert('Please enter your name.');return;}let score=0,vocab=0,passive=0;let details=[];questions.forEach((q,i)=>{const chosen=Number(new FormData(form).get('q'+i));const ok=chosen===q[3];if(ok){score++;if(q[0]==='v')vocab++;else passive++;}details.push((i+1)+'. '+(ok?'✓':'✗')+' '+q[1]+' | Your answer: '+q[2][chosen]+' | Correct: '+q[2][q[3]]);});const pct=Math.round(score/questions.length*100);const out=document.getElementById('result');out.style.display='block';out.innerHTML='<h2>Result for <span id="who"></span></h2><h1>'+score+' / '+questions.length+' ('+pct+'%)</h1><p>Vocabulary: '+vocab+'/10 · Passive voice: '+passive+'/10</p><p class="muted">Save or copy your result and show it to your teacher. Results are not automatically sent to the teacher.</p><button id="copy" type="button">Copy teacher summary</button><h3>Answer review</h3><div id="review"></div>';document.getElementById('who').textContent=name;const review=document.getElementById('review');details.forEach((d,i)=>{const p=document.createElement('p');p.className=Number(new FormData(form).get('q'+i))===questions[i][3]?'correct':'wrong';p.textContent=d;review.append(p)});document.getElementById('copy').onclick=()=>navigator.clipboard.writeText('English Unit 3 — '+name+' — '+score+'/20 ('+pct+'%) — Vocabulary '+vocab+'/10 — Passive '+passive+'/10\n'+details.join('\n')).then(()=>alert('Copied!')).catch(()=>alert('Copy unavailable. Please screenshot your score.'));form.querySelectorAll('input,button').forEach(x=>x.disabled=true);out.scrollIntoView({behavior:'smooth'});});
</script></body></html>
