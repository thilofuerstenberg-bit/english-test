<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar Quest · Teacher Results</title><style>body{font-family:system-ui,sans-serif;background:#f3f6fc;color:#172443;margin:0;padding:22px}.wrap{max-width:1000px;margin:auto}.panel{background:white;border:1px solid #dde5f2;border-radius:18px;padding:24px;margin:18px 0}h1{color:#263f89}input,button{padding:12px;border-radius:10px;font:inherit}input{border:1px solid #bfc9dc;max-width:100%;width:320px}button{border:0;background:#4057bd;color:white;cursor:pointer;margin:5px}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;border-bottom:1px solid #e5e9f1;padding:11px}th{background:#edf0fb}.scroll{overflow-x:auto}.muted{color:#65728a}.hidden{display:none}.stats{font-size:20px;font-weight:700}</style></head><body><div class="wrap"><h1>📊 Grammar Quest · Teacher Dashboard</h1><p class="muted">Private student test results · Unit 4 · Life in the Past</p><section id="login" class="panel"><h2>Teacher sign in</h2><p>Enter your registered teacher email. Supabase will send you a secure sign-in link.</p><input id="email" type="email" value="thilo.fuerstenberg@gmail.com" autocomplete="email"><button id="send">Send sign-in link</button><p id="loginMessage" role="status"></p></section><section id="dashboard" class="hidden"><div class="panel"><button id="refresh">Refresh results</button><button id="csv">Export CSV</button><button id="signout">Sign out</button><p class="stats" id="summary"></p><p id="status" role="status"></p></div><div class="panel scroll"><table><thead><tr><th>Submitted</th><th>Student</th><th>Score</th><th>Percent</th><th>Duration</th><th>Tab departures</th></tr></thead><tbody id="rows"></tbody></table></div></section></div><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.3/+esm';
const sb=createClient('https://xdnqnngenhwkzubcijud.supabase.co','sb_publishable_zqk_oUhB8G3LI6DHYcildQ_4hsYkv95',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const teacher='thilo.fuerstenberg@gmail.com', $=id=>document.getElementById(id);let records=[];
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function updateAuth(){const {data:{user}}=await sb.auth.getUser();const allowed=user?.email?.toLowerCase()===teacher;$('login').classList.toggle('hidden',allowed);$('dashboard').classList.toggle('hidden',!allowed);if(allowed)await load()}
async function load(){$('status').textContent='Loading…';const {data,error}=await sb.from('grammar_quest_results').select('student_name,score,total,tab_departures,duration_seconds,submitted_at').order('submitted_at',{ascending:false}).limit(1000);if(error){$('status').textContent='Unable to load results: '+error.message;return}records=data||[];$('status').textContent=records.length===1000?'Showing latest 1000 results. Export includes these rows.':'';$('summary').textContent=records.length+' submitted tests'+(records.length?' · Average '+Math.round(records.reduce((n,r)=>n+r.score,0)/records.length/25*100)+'%':'');$('rows').innerHTML=records.map(r=>'<tr><td>'+safe(new Date(r.submitted_at).toLocaleString('en-GB'))+'</td><td>'+safe(r.student_name)+'</td><td>'+r.score+'/'+r.total+'</td><td>'+Math.round(r.score/r.total*100)+'%</td><td>'+Math.floor(r.duration_seconds/60)+'m '+r.duration_seconds%60+'s</td><td>'+r.tab_departures+'</td></tr>').join('')||'<tr><td colspan="6">No submissions yet.</td></tr>'}
$('send').onclick=async()=>{const email=$('email').value.trim().toLowerCase();if(email!==teacher){$('loginMessage').textContent='This dashboard is available only to the registered teacher account.';return}const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});$('loginMessage').textContent=error?'Sign-in error: '+error.message:'Check your email for the secure sign-in link.'};
$('refresh').onclick=load;$('signout').onclick=async()=>{await sb.auth.signOut();records=[];await updateAuth()};
$('csv').onclick=()=>{const headings=['Submitted','Student','Score','Total','Percent','Duration seconds','Tab departures'];const values=records.map(r=>[r.submitted_at,r.student_name,r.score,r.total,Math.round(r.score/r.total*100),r.duration_seconds,r.tab_departures]);const escapeCsv=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv=[headings,...values].map(a=>a.map(escapeCsv).join(',')).join('\r\n');const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='grammar-quest-results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
sb.auth.onAuthStateChange(()=>{setTimeout(updateAuth,0)});updateAuth();
</script></body></html>
